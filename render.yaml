services:
  - type: web
    name: career-ai-platform-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_DEFAULT_TIMEOUT
        value: 100
    healthCheckPath: /health
